  <style>
    .page-404 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 1rem;
    }
    .page-404-glow {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .page-404-glow::after {
      content: '';
      width: 600px;
      height: 600px;
      background: var(--taxi);
      border-radius: 50%;
      filter: blur(180px);
      opacity: 0.1;
    }
    .icon-404 {
      position: relative;
      margin-bottom: 2rem;
      animation: fadeInScale 0.6s ease-out;
    }
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    .icon-404-ring {
      position: absolute;
      inset: -1rem;
      border: 1px dashed rgba(255,184,0,0.2);
      border-radius: 50%;
      animation: spin 20s linear infinite;
    }
    .icon-404-pulse {
      position: absolute;
      inset: 0;
      background: rgba(255,184,0,0.2);
      border-radius: 50%;
      filter: blur(15px);
      animation: pulse 2s ease-in-out infinite;
    }
    .icon-404-inner {
      position: relative;
      width: 7rem;
      height: 7rem;
      background: linear-gradient(135deg, #111, #0a0a0a);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--white-10);
      box-shadow: 0 0 40px rgba(255,184,0,0.15);
    }
    .icon-404-car {
      color: var(--taxi);
      filter: drop-shadow(0 0 10px rgba(255,184,0,0.5));
      animation: carMove 3s ease-in-out infinite;
    }
    @keyframes carMove {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(8px); }
      75% { transform: translateX(-8px); }
    }
    .text-404 {
      text-align: center;
      animation: fadeInUp 0.6s ease-out 0.2s both;
    }
    .title-404 {
      font-family: var(--font-display);
      font-size: clamp(5rem, 20vw, 7.5rem);
      line-height: 1;
      letter-spacing: -0.05em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .subtitle-404 {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .desc-404 {
      color: var(--gray-400);
      font-size: 0.875rem;
      max-width: 28rem;
      margin: 0 auto 2.5rem;
      line-height: 1.7;
      font-weight: 300;
    }
    @media (min-width: 640px) {
      .desc-404 { font-size: 1rem; }
    }
    .buttons-404 {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 28rem;
      animation: fadeInUp 0.6s ease-out 0.4s both;
    }
    @media (min-width: 640px) {
      .buttons-404 { flex-direction: row; }
    }
    .buttons-404 a {
      flex: 1;
      text-align: center;
    }
    .phone-404 {
      margin-top: 2rem;
      animation: fadeInUp 0.6s ease-out 0.6s both;
    }
    .phone-404 a {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--gray-500);
      font-size: 0.875rem;
      transition: color 0.3s;
    }
    .phone-404 a:hover { color: var(--taxi); }
    .brand-404 {
      position: absolute;
      bottom: 2rem;
      font-family: var(--font-display);
      font-size: 1.25rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #1f2937;
      animation: fadeInUp 0.8s ease-out 0.8s both;
    }
    .brand-404 span { color: rgba(255,184,0,0.4); }
  </style>
